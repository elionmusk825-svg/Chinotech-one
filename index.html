<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>CHINOTECH ONE MARKETPLACE</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111827;
  color:white;
  box-shadow:0 2px 12px #0005
}

.top{
  max-width:1500px;
  margin:auto;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}

.logo{
  font-weight:900;
  font-size:20px;
  min-width:210px
}

.logo b{
  background:#facc15;
  color:#111827;
  padding:8px;
  border-radius:9px;
  margin-right:7px
}

.search{
  flex:1;
  display:flex;
  min-width:230px
}

.search input{
  flex:1;
  padding:13px;
  border:0;
  outline:0;
  border-radius:8px 0 0 8px
}

.search button{
  border:0;
  background:#facc15;
  padding:0 18px;
  border-radius:0 8px 8px 0
}

.head{
  display:flex;
  gap:6px
}

.head button{
  border:1px solid #374151;
  background:#1f2937;
  color:white;
  padding:10px;
  border-radius:7px
}

.nav{
  overflow:auto;
  background:#1f2937;
  white-space:nowrap
}

.navin{
  max-width:1500px;
  margin:auto;
  display:flex;
  gap:4px;
  padding:5px
}

.nav button{
  border:0;
  background:none;
  color:white;
  font-size:12px;
  padding:10px;
  border-radius:6px
}

.nav button:hover{
  background:#374151
}

.hero{
  max-width:1500px;
  margin:18px auto;
  padding:0 12px
}

.heroBox{
  min-height:340px;
  border-radius:18px;
  padding:35px;
  color:white;
  background:
  linear-gradient(90deg,#111827ee,#11182755),
  url("https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1600&q=85")
  center/cover
}

.hero h1{
  font-size:clamp(32px,5vw,56px);
  max-width:700px;
  margin:0 0 12px
}

.hero p{
  max-width:650px;
  line-height:1.6
}

.btn{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  font-weight:800;
  margin:3px
}

.yellow{
  background:#facc15;
  color:#111827
}

.dark{
  background:#111827;
  color:white
}

.section{
  max-width:1500px;
  margin:22px auto;
  padding:0 12px
}

.section h2{
  margin:0 0 14px
}

.cats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:9px
}

.cat{
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:13px;
  text-align:center;
  cursor:pointer
}

.cat:hover{
  box-shadow:0 5px 15px #0002;
  transform:translateY(-2px)
}

.cat span{
  font-size:28px;
  display:block;
  margin-bottom:6px
}

.filters{
  background:white;
  padding:12px;
  border-radius:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px
}

.filters input,
.filters select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:7px;
  outline:none
}

.filters input{
  flex:1;
  min-width:200px
}

.products{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:13px
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:10px;
  overflow:hidden;
  transition:.2s
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px #0001
}

.photo{
  height:200px;
  position:relative;
  background:#eee
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:#ef4444;
  color:white;
  font-size:10px;
  font-weight:bold;
  padding:5px;
  border-radius:5px
}

.body{
  padding:11px
}

.small{
  font-size:11px;
  color:#6b7280
}

.name{
  font-weight:800;
  min-height:35px;
  margin-top:4px
}

.stars{
  color:#f59e0b;
  font-size:12px;
  margin:5px 0
}

.price{
  font-size:18px;
  font-weight:900
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:9px
}

.actions button{
  border:0;
  padding:9px;
  border-radius:6px;
  font-weight:bold;
  font-size:11px
}

.cart{
  background:#facc15
}

.buy{
  background:#111827;
  color:white
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.stat{
  background:white;
  padding:17px;
  border-radius:10px;
  border:1px solid #ddd
}

.stat b{
  font-size:24px;
  display:block;
  margin-top:5px
}

.infoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.infoCard{
  background:white;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd
}

footer{
  margin-top:40px;
  background:#111827;
  color:white;
  padding:35px 15px
}

.foot{
  max-width:1500px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px
}

.foot h3{
  color:#facc15
}

.foot p{
  color:#d1d5db;
  line-height:1.7
}

.overlay,
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:200;
  display:none
}

.overlay.show{
  display:block
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px
}

.drawer{
  margin-left:auto;
  background:white;
  height:100%;
  width:min(450px,95%);
  padding:18px;
  overflow:auto
}

.box{
  background:white;
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:12px;
  padding:20px
}

.drawerhead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.close{
  border:0;
  background:#ef4444;
  color:white;
  padding:8px;
  border-radius:5px
}

.item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ddd
}

.item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:6px
}

.qty button{
  border:1px solid #ccc;
  background:white;
  margin:3px;
  padding:3px 8px
}

.pay{
  width:100%;
  padding:14px;
  border:0;
  background:#00c853;
  color:white;
  font-weight:900;
  border-radius:7px;
  margin-top:15px
}

.box input,
.box select,
.box textarea{
  width:100%;
  padding:11px;
  margin:5px 0 12px;
  border:1px solid #ccc;
  border-radius:6px
}

.detailimg{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:8px
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,100px);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:7px;
  z-index:500;
  transition:.25s
}

.toast.show{
  transform:translate(-50%,0)
}

.empty{
  grid-column:1/-1;
  background:white;
  padding:40px;
  text-align:center;
  border-radius:10px
}

@media(max-width:1100px){
  .products{
    grid-template-columns:repeat(4,1fr)
  }
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(3,1fr)
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .foot{
    grid-template-columns:repeat(2,1fr)
  }

  .infoGrid{
    grid-template-columns:1fr
  }
}

@media(max-width:520px){
  .products{
    grid-template-columns:repeat(2,1fr)
  }

  .photo{
    height:150px
  }

  .foot{
    grid-template-columns:1fr
  }

  .logo{
    width:100%
  }

  .heroBox{
    padding:25px
  }
}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
<b>C1</b> CHINOTECH ONE
</div>

<div class="search">
<input
id="q"
placeholder="Search phones, laptops, shoes, TVs..."
oninput="render()">

<button onclick="render()">🔍</button>
</div>

<div class="head">

<button onclick="openCart()">
🛒 <span id="count">0</span>
</button>

<button onclick="openSell()">
SELL
</button>

</div>

</div>

<div class="nav">
<div class="navin" id="nav"></div>
</div>

</header>


<section class="hero">

<div class="heroBox">

<h1>Everything You Need in One Marketplace</h1>

<p>
Shop phones, laptops, electronics, fashion, beauty,
home appliances, gadgets, accessories and more.
</p>

<button
class="btn yellow"
onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
SHOP NOW
</button>

<button
class="btn dark"
onclick="openSell()">
SELL YOUR PRODUCT
</button>

</div>

</section>


<section class="section">

<h2>Categories</
