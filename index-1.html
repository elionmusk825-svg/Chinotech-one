<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay for Apex</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .payment-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }

    .payment-card h1 {
      margin-bottom: 10px;
    }

    .payment-card p {
      color: #666;
      margin-bottom: 25px;
    }

    .pay-button {
      display: inline-block;
      background: #0aa56f;
      color: white;
      padding: 14px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .pay-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="payment-card">
    <h1>Apex</h1>
    <p>Chinotech One Market Place</p>

    <a
      class="pay-button"
      href="https://paystack.shop/pay/kkof1e1670"
      target="_blank"
      rel="noopener noreferrer"
    >
      Pay Now
    </a>
  </div>

</body>
</html>
